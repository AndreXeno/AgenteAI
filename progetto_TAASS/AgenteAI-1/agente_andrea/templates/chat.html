<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind&Body Coach AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Sora', sans-serif;
        }

        .chat-container {
            height: calc(100vh - 180px);
        }

        .message-bubble {
            max-width: 80%;
        }
    </style>
</head>

<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-200 h-screen flex flex-col">

    <header class="bg-white dark:bg-gray-800 shadow-sm p-4 flex items-center justify-between">
        <div class="flex items-center space-x-2">
            <span class="text-2xl">🧘‍♂️</span>
            <h1 class="text-xl font-bold text-gray-900 dark:text-white">Mind&Body Coach</h1>
        </div>
        <a href="/"
            class="text-sm text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200">Home</a>
    </header>

    <main class="flex-1 container mx-auto p-4 flex flex-col max-w-4xl">
        <div id="chat-history"
            class="chat-container overflow-y-auto p-4 space-y-4 bg-white dark:bg-gray-800 rounded-lg shadow-sm mb-4">
            <!-- Messages will appear here -->
            <div class="flex justify-start">
                <div class="message-bubble bg-gray-100 dark:bg-gray-700 p-3 rounded-lg rounded-tl-none">
                    <p>Ciao! Sono Mind&Body, il tuo coach personale. Come posso aiutarti oggi?</p>
                </div>
            </div>
        </div>

        <div class="flex space-x-2">
            <input type="text" id="user-input"
                class="flex-1 p-3 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-teal-400"
                placeholder="Scrivi un messaggio..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()"
                class="bg-teal-400 hover:bg-teal-500 text-white font-bold py-3 px-6 rounded-lg transition-colors">
                Invia
            </button>
        </div>
    </main>

    <script>
        const chatHistory = document.getElementById('chat-history');
        const userInput = document.getElementById('user-input');

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Add user message
            appendMessage(text, 'user');
            userInput.value = '';

            // Show loading state (optional)

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, username: 'guest' }) // TODO: Handle username
                });

                const data = await response.json();
                appendMessage(data.response, 'bot');
            } catch (error) {
                console.error('Error:', error);
                appendMessage('Mi dispiace, si è verificato un errore di connessione.', 'bot');
            }
        }

        function appendMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'}`;

            const bubble = document.createElement('div');
            bubble.className = `message-bubble p-3 rounded-lg ${sender === 'user'
                    ? 'bg-blue-100 dark:bg-blue-900 text-blue-900 dark:text-blue-100 rounded-tr-none'
                    : 'bg-gray-100 dark:bg-gray-700 text-gray-900 dark:text-gray-100 rounded-tl-none'
                }`;

            // Simple markdown-like rendering for bold text (optional)
            bubble.innerHTML = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');

            div.appendChild(bubble);
            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }
    </script>
</body>

</html>
